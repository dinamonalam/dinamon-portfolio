<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="fitlog-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c0f" />
      <stop offset="50%" stop-color="#12161d" />
      <stop offset="100%" stop-color="#0a0c0f" />
    </linearGradient>
    <linearGradient id="lime-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccff00" />
      <stop offset="100%" stop-color="#a6d900" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#fitlog-bg)" />
  
  <!-- Subtle Grid Accent -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Top Navbar matching real app -->
  <rect x="0" y="0" width="1200" height="68" fill="#0f1115" />
  <line x1="0" y1="68" x2="1200" y2="68" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Logo (Dumbbell in Lime Box) -->
  <rect x="50" y="18" width="32" height="32" rx="6" fill="#ccff00" />
  <g transform="translate(56, 24)" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="10" x2="16" y2="10" />
    <line x1="3" y1="7" x2="3" y2="13" />
    <line x1="17" y1="7" x2="17" y2="13" />
    <line x1="1" y1="8" x2="1" y2="12" />
    <line x1="19" y1="8" x2="19" y2="12" />
  </g>
  <text x="92" y="40" fill="#ffffff" font-family="'Oswald', Impact, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">FITLOG</text>

  <!-- Nav Links -->
  <rect x="515" y="19" width="85" height="30" rx="15" fill="#ccff00" />
  <text x="557" y="39" fill="#000000" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Workout</text>
  <text x="645" y="39" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12" font-weight="600">My Plan</text>

  <!-- Plan & Saved Counters on right -->
  <rect x="990" y="19" width="75" height="30" rx="15" fill="#ccff00" />
  <text x="1027" y="39" fill="#000000" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Plan • 4</text>

  <rect x="1075" y="19" width="80" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  <text x="1115" y="39" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Saved • 8</text>

  <!-- Hero Banner matching real FitLog app -->
  <g transform="translate(50, 95)" filter="url(#card-shadow)">
    <rect width="1100" height="235" rx="18" fill="#161a20" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Hero Text Content -->
    <text x="50" y="45" fill="#ccff00" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="2.5">WORKOUT LIBRARY &amp; TRACKER</text>
    
    <text x="50" y="90" fill="#ffffff" font-family="'Oswald', Impact, sans-serif" font-size="34" font-weight="800" text-transform="uppercase" letter-spacing="1">TRAIN WITH INTENT. LOG EVERY SET.</text>
    
    <text x="50" y="128" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14" max-width="600">FitLog is a dark, precision gym companion: select lifts, configure custom routines,</text>
    <text x="50" y="150" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">log target reps &amp; volume, and track weekly progressive overload performance.</text>

    <!-- Browse Button -->
    <rect x="50" y="175" width="180" height="38" rx="19" fill="#ccff00" />
    <text x="140" y="199" fill="#000000" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1" text-anchor="middle">EXPLORE WORKOUTS ↓</text>

    <!-- Right Side Graphic / Dumbbell Icon Illustration -->
    <circle cx="950" cy="118" r="75" fill="#ccff00" fill-opacity="0.06" stroke="#ccff00" stroke-opacity="0.2" stroke-width="1.5" />
    <circle cx="950" cy="118" r="45" fill="#ccff00" fill-opacity="0.1" />
    <g transform="translate(928, 96)" fill="none" stroke="#ccff00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 28 L32 8" />
      <line x1="8" y1="24" x2="16" y2="32" />
      <line x1="28" y1="4" x2="36" y2="12" />
      <line x1="5" y1="27" x2="13" y2="35" stroke-width="4" />
      <line x1="31" y1="1" x2="39" y2="9" stroke-width="4" />
    </g>
  </g>

  <!-- Category & Workout Cards Row -->
  <!-- Card 1: Barbell Bench Press -->
  <g transform="translate(50, 355)" filter="url(#card-shadow)">
    <rect width="345" height="280" rx="16" fill="#161a20" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <rect x="0" y="0" width="345" height="6" rx="3" fill="#ccff00" />
    
    <!-- Card Header -->
    <rect x="20" y="24" width="70" height="22" rx="6" fill="#ccff00" fill-opacity="0.15" />
    <text x="55" y="39" fill="#ccff00" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CHEST</text>
    
    <text x="20" y="76" fill="#ffffff" font-family="'Oswald', sans-serif" font-size="20" font-weight="700">Barbell Bench Press</text>
    <text x="20" y="98" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Target: Pectoralis Major, Triceps</text>

    <!-- Workout Stats Grid -->
    <rect x="20" y="118" width="305" height="75" rx="10" fill="#0f1115" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    <text x="35" y="142" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SETS</text>
    <text x="35" y="172" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">4 Sets</text>
    
    <text x="135" y="142" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-weight="600">REPS</text>
    <text x="135" y="172" fill="#ccff00" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">8-10</text>
    
    <text x="235" y="142" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-weight="600">REST</text>
    <text x="235" y="172" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">90s</text>

    <!-- Card Action Button -->
    <rect x="20" y="212" width="305" height="42" rx="10" fill="#ccff00" />
    <text x="172" y="238" fill="#000000" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">+ ADD TO TODAY'S PLAN</text>
  </g>

  <!-- Card 2: Barbell Deadlift -->
  <g transform="translate(427, 355)" filter="url(#card-shadow)">
    <rect width="345" height="280" rx="16" fill="#161a20" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    
    <rect x="20" y="24" width="60" height="22" rx="6" fill="#3b82f6" fill-opacity="0.15" />
    <text x="50" y="39" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">BACK</text>
    
    <text x="20" y="76" fill="#ffffff" font-family="'Oswald', sans-serif" font-size="20" font-weight="700">Barbell Deadlift</text>
    <text x="20" y="98" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Target: Posterior Chain, Hamstrings</text>

    <rect x="20" y="118" width="305" height="75" rx="10" fill="#0f1115" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    <text x="35" y="142" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SETS</text>
    <text x="35" y="172" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">5 Sets</text>
    
    <text x="135" y="142" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-weight="600">REPS</text>
    <text x="135" y="172" fill="#ccff00" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">5 Reps</text>
    
    <text x="235" y="142" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-weight="600">REST</text>
    <text x="235" y="172" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">120s</text>

    <rect x="20" y="212" width="305" height="42" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <text x="172" y="238" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">IN PLAN ✓</text>
  </g>

  <!-- Card 3: Barbell Back Squat -->
  <g transform="translate(805, 355)" filter="url(#card-shadow)">
    <rect width="345" height="280" rx="16" fill="#161a20" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    
    <rect x="20" y="24" width="60" height="22" rx="6" fill="#10b981" fill-opacity="0.15" />
    <text x="50" y="39" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">LEGS</text>
    
    <text x="20" y="76" fill="#ffffff" font-family="'Oswald', sans-serif" font-size="20" font-weight="700">Barbell Back Squat</text>
    <text x="20" y="98" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Target: Quadriceps, Gluteus, Core</text>

    <rect x="20" y="118" width="305" height="75" rx="10" fill="#0f1115" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    <text x="35" y="142" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SETS</text>
    <text x="35" y="172" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">4 Sets</text>
    
    <text x="135" y="142" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-weight="600">REPS</text>
    <text x="135" y="172" fill="#ccff00" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">6-8</text>
    
    <text x="235" y="142" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-weight="600">REST</text>
    <text x="235" y="172" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">120s</text>

    <rect x="20" y="212" width="305" height="42" rx="10" fill="#ccff00" />
    <text x="172" y="238" fill="#000000" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">+ ADD TO TODAY'S PLAN</text>
  </g>
</svg>
