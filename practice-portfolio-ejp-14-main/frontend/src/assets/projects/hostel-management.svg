    <text x="20" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="800">384</text>
    <rect x="145" y="24" width="45" height="45" rx="10" fill="url(#hostel-blue)" fill-opacity="0.2"/>
    <circle cx="167" cy="46" r="10" fill="#3b82f6"/>
