    <text x="36" y="180" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TR</text>
    <text x="62" y="174" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Tanvir Rahman</text>
    <text x="62" y="188" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">ID: EEE-2024-019</text>
    <text x="260" y="181" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Room 201 (Block-A)</text>
    <rect x="410" y="168" width="95" height="22" rx="6" fill="#6366f1" fill-opacity="0.15" />
    <text x="457" y="183" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Double Shared</text>
    <text x="590" y="181" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Jan 15, 2026</text>
    <rect x="750" y="168" width="70" height="22" rx="6" fill="#10b981" fill-opacity="0.15" />
    <text x="785" y="183" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Paid</text>
    <line x1="20" y1="204" x2="895" y2="204" stroke="#334155" stroke-width="0.8" />

