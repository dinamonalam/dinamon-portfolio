<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="hostel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="hostel-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="hostel-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="hostel-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="hostel-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#hostel-bg)"/>

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1200" height="65" fill="#111827" fill-opacity="0.95" />
  <line x1="0" y1="65" x2="1200" y2="65" stroke="#334155" stroke-width="1" />
  
  <!-- Logo & Title -->
  <rect x="30" y="16" width="34" height="34" rx="8" fill="url(#hostel-blue)" />
  <!-- Hostel / Building Icon in Logo -->
  <path d="M40 40 L40 26 L47 21 L54 26 L54 40 Z" fill="#ffffff" />
  <text x="75" y="38" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">HostelMS<tspan fill="#38bdf8">.Portal</tspan></text>
  
  <!-- Search input mock -->
  <rect x="250" y="17" width="340" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="270" cy="33" r="5" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <line x1="274" y1="37" x2="279" y2="42" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="290" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Search students, rooms, fee vouchers...</text>
  
  <!-- Admin profile top-right -->
  <rect x="1030" y="15" width="140" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="1048" cy="33" r="12" fill="url(#hostel-indigo)" />
  <text x="1048" y="37" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">A</text>
  <text x="1068" y="37" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Admin</text>

  <!-- Left Sidebar Navigation -->
  <rect x="0" y="65" width="220" height="610" fill="#0b1329" fill-opacity="0.85" />
  <line x1="220" y1="65" x2="220" y2="675" stroke="#1e293b" stroke-width="1" />

  <!-- Nav Items -->
  <!-- Active Item: Dashboard -->
  <rect x="16" y="90" width="188" height="38" rx="8" fill="url(#hostel-blue)" />
  <text x="45" y="114" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Dashboard</text>

  <!-- Inactive Nav Items -->
  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
    <text x="45" y="156">Rooms &amp; Beds</text>
    <text x="45" y="196">Student Records</text>
    <text x="45" y="236">Fee Collection</text>
    <text x="45" y="276">Visitor Logbook</text>
    <text x="45" y="316">Hostel Staff</text>
    <text x="45" y="356">Monthly Reports</text>
    <text x="45" y="396">Settings</text>
  </g>

  <!-- Sidebar Status Box -->
  <rect x="16" y="550" width="188" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="34" cy="572" r="4" fill="#10b981" />
  <text x="44" y="576" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Server Online</text>
  <text x="28" y="600" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">PHP 8.2 • MySQL</text>
  <text x="28" y="622" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">v1.2.0 • Academic Build</text>

