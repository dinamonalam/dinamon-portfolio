    <text x="260" y="125" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Room 304 (Block-B)</text>
    <rect x="410" y="112" width="85" height="22" rx="6" fill="#3b82f6" fill-opacity="0.15" />
    <text x="452" y="127" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Single • AC</text>
