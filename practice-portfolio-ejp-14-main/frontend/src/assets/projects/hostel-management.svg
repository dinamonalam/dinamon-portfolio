    <text x="36" y="292" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RA</text>
    <text x="62" y="286" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Rifat Ahmed</text>
    <text x="62" y="300" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">ID: BBA-2023-045</text>
    <text x="260" y="293" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Room 412 (Block-C)</text>
