  <text x="255" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Hostel Management Dashboard</text>
  <text x="255" y="134" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Real-time room occupancy, resident verification &amp; accounting statistics</text>

  <!-- Action button top right of dashboard -->
  <rect x="1000" y="96" width="170" height="36" rx="8" fill="url(#hostel-emerald)" filter="url(#shadow)" />
  <text x="1085" y="119" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+ New Student Admission</text>

