    <circle cx="36" cy="232" r="14" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="36" y="236" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SH</text>
    <text x="62" y="230" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Sabbir Hossain</text>
    <text x="62" y="244" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">ID: CSE-2024-114</text>
    <text x="260" y="237" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Room 108 (Block-A)</text>
    <rect x="410" y="224" width="95" height="22" rx="6" fill="#6366f1" fill-opacity="0.15" />
    <text x="457" y="239" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Double Shared</text>
    <text x="590" y="237" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Feb 01, 2026</text>
    <rect x="750" y="224" width="70" height="22" rx="6" fill="#f59e0b" fill-opacity="0.15" />
    <text x="785" y="239" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pending</text>
